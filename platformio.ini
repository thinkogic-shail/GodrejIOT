; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; UART0 is the vending transport, not an interactive debug console.
monitor_speed = 9600
build_flags =
  -DCORE_DEBUG_LEVEL=0

lib_deps =
  knolleary/PubSubClient
  bblanchon/ArduinoJson@^7.0.4
  h2zero/NimBLE-Arduino
  vshymanskyy/TinyGSM@0.12.0

; Temporary bench test: prints captures on shared UART0, disables networking.
[env:counter_diagnostic]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -DCOUNTER_SERIAL_DIAGNOSTICS=1

; Read-only alternative command test; networking/MQTT remain enabled.
[env:machine_status_probe]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -DMACHINE_STATUS_PROBE=1
